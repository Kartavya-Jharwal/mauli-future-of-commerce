name: Deploy project website

on:
  push:
    branches: [main]
    paths:
      - 'apps/project-site/**'
      - 'deliverables/**/*.pdf'
      - 'deliverables/**/*.pptx'
      - 'deliverables/**/*.docx'
      - 'scripts/build_site.py'
      - 'scripts/check_site.py'
      - 'deliverables/client-brief.pdf'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble public website
        run: python3 scripts/build_site.py
      - name: Check website
        run: |
          python3 scripts/check_site.py
          node --check apps/project-site/app.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/project-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
