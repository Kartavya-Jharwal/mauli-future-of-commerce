<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand-Dyed Mauli Yarn — Textile Scroll</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-color: #FAFAFA; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .main-section {
            position: relative;
            width: 100vw;
            height: 350vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* 
          Hero loading viewport (Mango/Banana Leaf Green)
        */
        .hero-loading-viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0d321b 0%, #1e5c33 50%, #2a7a40 100%);
            z-index: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .content-wrapper {
            position: relative;
            display: flex;
            width: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* SVG Mauli Yarn Container (Removed digital drop-shadow) */
        .svg-container {
            position: absolute;
            right: -15%;
            top: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* Three.js Fabric/Cloth Overlay */
        #webgl-shader-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            mix-blend-mode: multiply; /* Better for textile dye burning into the background */
            opacity: 0.8;
        }

        .footer-placeholder {
            width: 100%;
            height: 50vh;
            transform: translateY(300vh);
            background-color: #111;
            border-top-left-radius: 2.5rem;
            border-top-right-radius: 2.5rem;
            position: relative;
            z-index: 20;
        }
    </style>
</head>
<body>

    <section class="main-section" id="scroll-container">
        
        <div class="hero-loading-viewport"></div>

        <div class="content-wrapper" id="hero-box">
            
            <div class="svg-container">
                <svg id="scroll-svg" width="1278" height="2319" viewBox="0 0 1278 2319" fill="none" overflow="visible" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- 
                          The Hand-Dyed Mauli Gradient 
                          Using smooth transitions to mimic dye bleeding in fabric
                        -->
                        <linearGradient id="mauliYarnBlend" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#B30006" />   
                            <stop offset="15%" stop-color="#D32F2F" />  
                            <stop offset="30%" stop-color="#E64A19" />  
                            <stop offset="45%" stop-color="#FF6F00" />  
                            <stop offset="60%" stop-color="#FF8F00" />  
                            <stop offset="75%" stop-color="#FFB300" />  
                            <stop offset="85%" stop-color="#FFC107" />  
                            <stop offset="100%" stop-color="#FFEB3B" /> 
                        </linearGradient>

                        <!-- 
                          Yarn / Fabric Texture Filter
                          Replaces the "glow" with physical displacement, fraying the 
                          edges of the stroke to look like woven threads and soft sweater fuzz.
                        -->
                        <filter id="fabricFuzz" x="-20%" y="-20%" width="140%" height="140%">
                            <!-- Generates high-frequency noise resembling fibers -->
                            <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" result="fibers" />
                            <!-- Displaces the vector path using the noise to fray the solid edges -->
                            <feDisplacementMap in="SourceGraphic" in2="fibers" scale="4" xChannelSelector="R" yChannelSelector="G" result="frayedPath" />
                            <!-- Soft blur to simulate the soft, blended bleeding of dyed yarn -->
                            <feGaussianBlur in="frayedPath" stdDeviation="0.8" result="softYarn" />
                        </filter>
                    </defs>

                    <!-- Thinner stroke-width (8) to look like delicate thread rather than a thick graphic -->
                    <path id="animated-path" 
                          d="M876.605 394.131C788.982 335.917 696.198 358.139 691.836 416.303C685.453 501.424 853.722 498.43 941.95 409.714C1016.1 335.156 1008.64 186.907 906.167 142.846C807.014 100.212 712.699 198.494 789.049 245.127C889.053 306.207 986.062 116.979 840.548 43.3233C743.932 -5.58141 678.027 57.1682 672.279 112.188C666.53 167.208 712.538 172.943 736.353 163.088C760.167 153.234 764.14 120.924 746.651 93.3868C717.461 47.4252 638.894 77.8642 601.018 116.979C568.164 150.908 557 201.079 576.467 246.924C593.342 286.664 630.24 310.55 671.68 302.614C756.114 286.446 729.747 206.546 681.86 186.442C630.54 164.898 492 209.318 495.026 287.644C496.837 334.494 518.402 366.466 582.455 367.287C680.013 368.538 771.538 299.456 898.634 292.434C1007.02 286.446 1192.67 309.384 1242.36 382.258C1266.99 418.39 1273.65 443.108 1247.75 474.477C1217.32 511.33 1149.4 511.259 1096.84 466.093C1044.29 420.928 1029.14 380.576 1033.97 324.172C1038.31 273.428 1069.55 228.986 1117.2 216.384C1152.2 207.128 1188.29 213.629 1194.45 245.127C1201.49 281.062 1132.22 280.104 1100.44 272.673C1065.32 264.464 1044.22 234.837 1032.77 201.413C1019.29 162.061 1029.71 131.126 1056.44 100.965C1086.19 67.4032 1143.96 54.5526 1175.78 86.1513C1207.02 117.17 1186.81 143.379 1156.22 166.691C1112.57 199.959 1052.57 186.238 999.784 155.164C957.312 130.164 899.171 63.7054 931.284 26.3214C952.068 2.12513 996.288 3.87363 1007.22 43.58C1018.15 83.2749 1003.56 122.644 975.969 163.376C948.377 204.107 907.272 255.122 913.558 321.045C919.727 385.734 990.968 497.068 1063.84 503.35C1111.46 507.456 1166.79 511.984 1175.68 464.527C1191.52 379.956 1101.26 334.985 1030.29 377.017C971.109 412.064 956.297 483.647 953.797 561.655C947.587 755.413 1197.56 941.828 936.039 1140.66C745.771 1285.32 321.926 950.737 134.536 1202.19C-6.68295 1391.68 -53.4837 1655.38 131.935 1760.5C478.381 1956.91 1124.19 1515 1201.28 1997.83C1273.66 2451.23 100.805 1864.7 303.794 2668.89" 
                          stroke="url(#mauliYarnBlend)" 
                          stroke-width="8" 
                          stroke-linecap="round"
                          filter="url(#fabricFuzz)" />
                </svg>
            </div>

            <!-- Three.js Fabric/Weave Distortion Layer -->
            <div id="webgl-shader-overlay"></div>
        </div>

        <div class="footer-placeholder"></div>
    </section>

    <script>
        const path = document.querySelector('#animated-path');
        const container = document.querySelector('#scroll-container');
        const pathLength = path.getTotalLength();

        path.style.strokeDasharray = pathLength + ' ' + pathLength;
        path.style.strokeDashoffset = pathLength;

        let currentScroll = 0;
        let targetScroll = 0;
        let scrollVelocity = 0;
        let lastScrollY = window.scrollY;

        function updateScrollMetrics() {
            const scrollY = window.scrollY;
            const maxScroll = container.scrollHeight - window.innerHeight;
            targetScroll = Math.min(Math.max(scrollY / maxScroll, 0), 1);
            
            scrollVelocity = scrollY - lastScrollY;
            lastScrollY = scrollY;
        }

        const containerElement = document.getElementById('webgl-shader-overlay');
        
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
        camera.position.z = 1;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(containerElement.offsetWidth, containerElement.offsetHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        containerElement.appendChild(renderer.domElement);

        const shaderUniforms = {
            uTime: { value: 0 },
            uScroll: { value: 0 },
            uVelocity: { value: 0 }
        };

        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float uTime;
            uniform float uScroll;
            uniform float uVelocity;
            varying vec2 vUv;

            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
            }

            void main() {
                // Creates a fine cross-hatch fabric weave pattern
                float weaveX = sin(vUv.x * 600.0);
                float weaveY = sin(vUv.y * 600.0);
                float clothGrain = (weaveX * weaveY) * 0.08;

                // Subtle organic fold distortion tied to velocity
                float foldDistortion = sin(vUv.y * 5.0 + uTime * 0.5) * (uVelocity * 0.001);
                
                // Shader tint shifts through the Mauli red/saffron spectrum
                vec3 baseColor = mix(vec3(0.83, 0.18, 0.18), vec3(0.90, 0.29, 0.10), vUv.x + foldDistortion);
                
                // Fine noise to simulate wool/cotton texture
                float fuzzNoise = random(vUv * 20.0 + uTime * 0.1) * 0.1;
                
                // Only reveal the texture mildly, mimicking dye seeping into cloth
                float alpha = clothGrain + fuzzNoise + 0.15;
                gl_FragColor = vec4(baseColor, alpha);
            }
        `;

        const shaderMaterial = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: shaderUniforms,
            transparent: true
        });

        const planeGeometry = new THREE.PlaneGeometry(2, 2);
        const plane = new THREE.Mesh(planeGeometry, shaderMaterial);
        scene.add(plane);

        let clock = new THREE.Clock();

        function animate() {
            currentScroll += (targetScroll - currentScroll) * 0.06;
            scrollVelocity *= 0.85;

            const mappedProgress = 0.5 + (currentScroll * 0.5);
            path.style.strokeDashoffset = pathLength * (1 - mappedProgress);

            shaderUniforms.uTime.value = clock.getElapsedTime();
            shaderUniforms.uScroll.value = currentScroll;
            shaderUniforms.uVelocity.value = scrollVelocity;

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        window.addEventListener('scroll', updateScrollMetrics);
        window.addEventListener('resize', () => {
            renderer.setSize(containerElement.offsetWidth, containerElement.offsetHeight);
            updateScrollMetrics();
        });

        updateScrollMetrics();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
